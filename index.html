<title>GameHub</title>
<style>
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e3f;
  --text:#e8e8f0;--muted:#7070a0;--accent:#7c4dff;--accent2:#00e5ff;
  --red:#ff4444;--green:#44ff88;--yellow:#ffcc44;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#app{min-height:100vh}
.page{display:none;min-height:100vh;padding:20px 16px 48px;flex-direction:column}
.page.active{display:flex}
.screen{max-width:480px;margin:0 auto;width:100%}
.hub-header{text-align:center;padding:48px 20px 36px}
.hub-logo{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub-sub{color:var(--muted);margin-top:8px;font-size:.9rem}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:440px;margin:0 auto;width:100%}
.game-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;user-select:none}
.game-card:active{transform:scale(.97)}
.game-card.live{border-color:var(--accent)}
.game-card.live:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(124,77,255,.25)}
.game-card.soon{opacity:.45;cursor:default}
.soon-badge{position:absolute;top:10px;right:-18px;background:var(--surface2);color:var(--muted);font-size:.6rem;padding:3px 24px;transform:rotate(30deg);letter-spacing:.05em;text-transform:uppercase}
.card-icon{font-size:2.4rem;margin-bottom:12px}
.card-name{font-size:.9rem;font-weight:700}
.title{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.input{display:block;width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;margin-bottom:12px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;-webkit-appearance:none}
.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:not(:disabled):hover{background:#9060ff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:9px 14px;font-size:.85rem;border-radius:8px}
.back{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:8px 0;margin-bottom:18px;display:flex;align-items:center;gap:5px}
.back:hover{color:var(--text)}
.alert{padding:11px 14px;border-radius:8px;background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);color:#ff8888;font-size:.85rem;margin-bottom:14px}
.info{padding:11px 14px;border-radius:8px;background:rgba(124,77,255,.1);border:1px solid rgba(124,77,255,.3);color:#b09fff;font-size:.85rem;margin-bottom:14px}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{color:var(--muted);font-size:.82rem}
.code-box{background:var(--surface2);border:2px solid var(--accent);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:22px}
.code-big{font-size:2.6rem;font-weight:900;letter-spacing:.18em;color:var(--accent2);font-family:'Courier New',monospace}
.code-hint{color:var(--muted);font-size:.78rem;margin-top:6px}
.player-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.player-row{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface2);border-radius:10px;border:1.5px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.player-name{font-weight:600;flex:1;font-size:.92rem}
.badge{font-size:.72rem;padding:3px 9px;border-radius:20px;background:var(--surface);color:var(--muted);white-space:nowrap}
.badge.host{background:rgba(124,77,255,.2);color:var(--accent)}
.badge.you{background:rgba(0,229,255,.15);color:var(--accent2)}
.badge.ready{background:rgba(68,255,136,.18);color:var(--green)}
.word-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:36px 24px;text-align:center;margin-bottom:22px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s}
.word-card.tap{cursor:pointer}
.word-card.tap:active{transform:scale(.98)}
.word-card.impostor{border-color:var(--red)}
.word-big{font-size:2.1rem;font-weight:900}
.theme-lbl{font-size:.83rem;color:var(--muted);margin-bottom:8px}
.timer-box{background:var(--surface2);border-radius:var(--r);padding:22px;text-align:center;margin-bottom:20px;border:1.5px solid var(--border)}
.timer-num{font-size:3rem;font-weight:900;font-family:'Courier New',monospace;color:var(--accent2);line-height:1}
.timer-num.urgent{color:var(--red)}
.timer-label{color:var(--muted);font-size:.8rem;margin-top:6px}
.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.vote-card{background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.vote-card:not(.no-vote):not(.done):hover{border-color:var(--accent)}
.vote-card:not(.no-vote):not(.done):active{transform:scale(.97)}
.vote-card.selected{border-color:var(--accent);background:rgba(124,77,255,.14)}
.vote-card.no-vote{opacity:.35;cursor:default}
.vote-card.done{opacity:.7;cursor:default}
.result-banner{padding:26px;text-align:center;border-radius:var(--r);margin-bottom:18px}
.result-banner.caught{background:rgba(68,255,136,.08);border:2px solid var(--green)}
.result-banner.escaped{background:rgba(255,68,68,.08);border:2px solid var(--red)}
.result-emoji{font-size:3rem;margin-bottom:8px}
.result-title{font-size:1.35rem;font-weight:800}
.result-sub{color:var(--muted);font-size:.88rem;margin-top:5px}
.word-reveal-box{background:var(--surface2);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;text-align:center}
.scores-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-radius:8px}
.score-pts{font-weight:700;color:var(--accent2)}
.status{padding:10px 14px;background:var(--surface2);border-radius:8px;color:var(--muted);font-size:.85rem;margin-bottom:12px;border:1px solid var(--border)}
.host-panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;margin-top:14px}
.host-panel-title{font-size:.8rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-weight:700}
.dots::after{content:'...';animation:d 1.4s infinite steps(4,end)}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.connecting{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function themeById(id){return THEMES.find(t=>t.id===id);}
const COLORS=['#7c4dff','#00e5ff','#ff4081','#69f0ae','#ffab40','#40c4ff','#ea80fc','#ccff90','#ff6e6e','#ffd740'];
function aC(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}
const EMOJIS=['😀','😎','🤠','🧐','🤩','😏','🤔','😤','🥸','🤪','😈','👻','🤖','🎭','🦊','🐯','🦁','🐸','🐧','🦄'];
function aE(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%EMOJIS.length;return EMOJIS[h];}
function init2(n){return String(n).trim().slice(0,2).toUpperCase();}
function players(){return Object.keys(gs?.players||{});}
function pData(n){return gs?.players?.[n]||{};}

// ── SYNC COM FIREBASE ─────────────────────────────────────────────────────────
function onGameState(snap){
  const prev=gs?.phase;
  gs=snap.val();
  if(!gs){
    if(!G.isHost){cleanLeave();}
    return;
  }
  if(gs.phase!==prev){
    G.wordRevealed=false;G.myVote=null;advancing=false;
    if(gs.phase==='discussion')startTimer();
    else clearInterval(timerInt);
  }
  // host: auto-avança quando todos votaram
  if(G.isHost&&gs.phase==='voting'&&!advancing){
    const names=players();
    if(names.length>1&&names.every(n=>pData(n).vote)){hostResult();}
  }
  // host: processa palpite do impostor
  if(G.isHost&&gs.phase==='results'&&gs.result?.caught&&gs.result?.impostorGuess==null){
    const imp=gs.impostorName;
    if(imp&&pData(imp).impostorGuess!=null){
      const guess=pData(imp).impostorGuess;
      const correct=(gs.word||'').toLowerCase()===guess.toLowerCase();
      const ns={...gs.scores||{}};
      if(correct)ns[imp]=(ns[imp]||0)+3;
      roomRef.update({'result/impostorGuess':guess,'result/impostorGuessCorrect':correct,scores:ns});
    }
  }
  render();
}

function startTimer(){
  clearInterval(timerInt);
  const tick=()=>{
    timerVal=Math.max(0,Math.ceil(((gs?.discEnd||0)-Date.now())/1000));
    render();
    if(timerVal<=0){
      clearInterval(timerInt);
      if(G.isHost&&gs?.phase==='discussion'&&!advancing){
        advancing=true;
        roomRef.update({phase:'voting',discEnd:0}).finally(()=>{advancing=false;});
      }
    }
  };
  timerInt=setInterval(tick,500);tick();
}

// ── AÇÕES DO HOST ─────────────────────────────────────────────────────────────
async function hostStart(){
  const names=players();
  if(names.length<2){G.error='Precisa de pelo menos 2 jogadores!';render();return;}
  const t=rand(THEMES),w=rand(t.words),imp=rand(names),round=(gs?.round||0)+1;
  const playerData={};
  names.forEach(n=>{playerData[n]={...pData(n),ready:false,vote:null,impostorGuess:null};});
  await roomRef.update({phase:'word',themeId:t.id,word:w,impostorName:imp,discEnd:0,round,result:null,players:playerData});
}
async function hostDiscuss(){await roomRef.update({phase:'discussion',discEnd:Date.now()+180000});}
async function hostResult(){
  if(advancing)return;advancing=true;
  try{
    const names=players();
    const counts={};
    names.forEach(n=>{const v=pData(n).vote;if(v)counts[v]=(counts[v]||0)+1;});
    let top=0,elim=null;
    for(const[n,c]of Object.entries(counts)){if(c>top){top=c;elim=n;}}
    const caught=elim===gs.impostorName;
    const ns={...gs.scores||{}};
    names.forEach(n=>{if(!(n in ns))ns[n]=0;});
    if(caught){names.forEach(n=>{if(n!==gs.impostorName)ns[n]=(ns[n]||0)+1;});}
    else if(gs.impostorName)ns[gs.impostorName]=(ns[gs.impostorName]||0)+2;
    await roomRef.update({phase:'results',scores:ns,result:{caught,eliminated:elim,counts,impostorName:gs.impostorName,word:gs.word}});
  }finally{advancing=false;}
}

// ── AÇÕES DOS JOGADORES ───────────────────────────────────────────────────────
async function setReady(){
  G.wordRevealed=true;
  await roomRef.child('players/'+G.myName).update({ready:true});
  render();
}
async function castVote(name){
  if(G.myVote)return;
  G.myVote=name;
  await roomRef.child('players/'+G.myName).update({vote:name});
  render();
}
async function sendGuess(){
  const g=G.impostorGuess.trim();if(!g)return;
  await roomRef.child('players/'+G.myName).update({impostorGuess:g});
  G.impostorGuess='';render();
}

// ── ENTRAR / CRIAR SALA ───────────────────────────────────────────────────────
async function joinGame(code,name,asHost){
  G.loading=true;G.error='';render();
  try{
    const ref=db.ref('rooms/'+code.toLowerCase());
    if(asHost){
      await ref.set({phase:'lobby',themeId:null,word:'',impostorName:null,discEnd:0,
        round:0,scores:{},result:null,hostName:name,
        players:{[name]:{isHost:true,ready:false,vote:null,impostorGuess:null,joinedAt:Date.now()}}});
    }else{
      const snap=await ref.once('value');
      if(!snap.exists()){G.loading=false;G.error='Sala não encontrada! Verifique o código.';render();return;}
      const d=snap.val();
      if(d.players&&d.players[name]){G.loading=false;G.error='Este nome já está em uso nesta sala!';render();return;}
      if(d.phase&&d.phase!=='lobby'){G.loading=false;G.error='O jogo já começou nesta sala.';render();return;}
      await ref.child('players/'+name).set({isHost:false,ready:false,vote:null,impostorGuess:null,joinedAt:Date.now()});
    }
    G.roomCode=code.toUpperCase();G.myName=name;G.isHost=asHost;
    G.loading=false;G.page='lobby';roomRef=ref;
    // Remove jogador automaticamente ao fechar o navegador
    ref.child('players/'+name).onDisconnect().remove();
    unsubGame=ref.on('value',onGameState);
    render();
  }catch(e){
    console.error(e);
    G.loading=false;
    G.error='Não foi possível conectar. Verifique sua internet.';
    render();
  }
}
async function createRoom(){
  const name=(G.nameInput||'').trim();
  if(!name){G.error='Digite seu nome primeiro!';render();return;}
  if(name.length>20){G.error='Nome muito longo (máx 20 caracteres)!';render();return;}
  await joinGame(randCode(),name,true);
}
async function enterRoom(){
  const name=(G.nameInput||'').trim(),code=(G.codeInput||'').trim().toUpperCase();
  if(!name){G.error='Digite seu nome primeiro!';render();return;}
  if(!code||code.length!==4){G.error='O código deve ter 4 letras!';render();return;}
  await joinGame(code,name,false);
}
async function cleanLeave(){
  clearInterval(timerInt);
  if(roomRef&&unsubGame){roomRef.off('value',unsubGame);unsubGame=null;}
  roomRef=null;gs=null;
  G.roomCode='';G.myName='';G.isHost=false;
  G.myVote=null;G.wordRevealed=false;G.error='';advancing=false;G.impostorGuess='';
  G.page='hub';render();
}
async function leaveRoom(){
  if(roomRef){
    if(G.isHost){await roomRef.remove().catch(()=>{});}
    else{
      roomRef.child('players/'+G.myName).onDisconnect().cancel();
      await roomRef.child('players/'+G.myName).remove().catch(()=>{});
    }
  }
  await cleanLeave();
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function render(){
  if(G.page==='hub')return rHub();
  if(G.page==='home')return rHome();
  rGame();
}

    <div class="hub-logo">🎮 GameHub</div>
    <div class="hub-sub">Jogos para jogar com seus amigos</div>
  </div>
  <div class="games-grid">
    <div class="game-card live" onclick="G.page='home';G.error='';G.nameInput='';G.codeInput='';render()">

}

  <div style="font-size:2.2rem;margin-bottom:8px">🕵️</div>

  ${G.error?`<div class="alert">${esc(G.error)}</div>`:''}

    value="${esc(G.nameInput||'')}" oninput="G.nameInput=this.value" autocomplete="off"/>

    ${G.loading?'Criando sala<span class="dots"></span>':'✨ Criar Nova Sala'}
  </button>
  <div class="divider"><div class="divider-line"></div><span class="divider-text">ou entre em uma sala existente</span><div class="divider-line"></div></div>

    style="text-transform:uppercase;letter-spacing:.18em;font-size:1.2rem;text-align:center" autocomplete="off"/>

</div></div>`;

}
function rGame(){
  const ph=gs?.phase||'lobby';
  if(ph==='word')return rWord();
  if(ph==='discussion')return rDiscuss();
  if(ph==='voting')return rVote();
  if(ph==='results')return rResults();
  return rLobby();
}
function rLobby(){
  const names=players();
  const shareUrl=location.href;
  app.innerHTML=`<div class="page active"><div class="screen" style="padding-top:28px">
  <button class="back" onclick="leaveRoom()">← Sair</button>
  <div class="code-box">
    <div style="color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase">Código da Sala</div>
    <div class="code-big">${G.roomCode}</div>
    <div class="code-hint">Compartilhe com seus amigos</div>
    <button class="btn btn-secondary btn-sm" style="max-width:200px;margin:10px auto 0"
      onclick="navigator.clipboard?.writeText('${esc(shareUrl)}');this.textContent='✅ Link copiado!'">📋 Copiar link</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-weight:700">Jogadores (${names.length})</div>
    ${!G.isHost?'<div style="color:var(--muted);font-size:.78rem">Aguardando host<span class="dots"></span></div>':''}
  </div>
  <div class="player-list">${names.map(n=>`<div class="player-row">
    <div class="avatar" style="background:${aC(n)}">${init2(n)}</div>
    <div class="player-name">${esc(n)}</div>
    <div class="badge ${n===G.myName?'you':(n===gs?.hostName?'host':'')}">${n===G.myName?'você':(n===gs?.hostName?'Host':'Jogador')}</div>
  </div>`).join('')||'<div style="color:var(--muted);padding:14px;text-align:center">Aguardando jogadores<span class="dots"></span></div>'}</div>
  ${G.error?`<div class="alert">${esc(G.error)}</div>`:''}
  ${G.isHost
    ?`<button class="btn btn-primary" onclick="hostStart()" ${names.length<2?'disabled':''}>
        ${names.length>=2?'🎮 Iniciar Jogo':'Aguardando pelo menos 2 jogadores'}
      </button>`
    :'<div class="status">Aguardando o host iniciar o jogo<span class="dots"></span></div>'
  }
</div></div>`;
}
function rWord(){
  const names=players();
  const isImp=G.myName===gs?.impostorName;
  const t=gs?.themeId?themeById(gs.themeId):null;
  const meReady=pData(G.myName).ready;
  const readyCount=names.filter(n=>pData(n).ready).length;
  app.innerHTML=`<div class="page active"><div class="screen" style="padding-top:28px">
  <div style="text-align:center;margin-bottom:20px">
    <div style="color:var(--muted);font-size:.82rem">RODADA ${gs?.round||1} · ${t?.cat||''}</div>
    <div style="font-size:1.2rem;font-weight:800;margin-top:5px">Veja sua palavra em privado</div>
  </div>
  ${G.wordRevealed
    ?`<div class="word-card ${isImp?'impostor':''}">
        ${isImp
          ?`<div class="word-big" style="color:var(--red)">🎭</div>
            <div style="font-size:1.1rem;font-weight:800;color:var(--red);margin-top:10px">Você é o IMPOSTOR!</div>
            <div style="color:var(--muted);font-size:.85rem;margin-top:8px;line-height:1.5">Tema: <b>${esc(t?.cat||'')}</b><br>Descubra a palavra sem ser pego!</div>`
          :`<div class="theme-lbl">${esc(t?.cat||'')}</div><div class="word-big">${esc(gs?.word||'')}</div>`
        }
      </div>
      ${!meReady
        ?`<button class="btn btn-primary" onclick="setReady()">✅ Estou pronto</button>`
        :`<div class="status">✅ Pronto! (${readyCount}/${names.length} prontos)</div>`
      }
      ${G.isHost?`<div class="host-panel"><div class="host-panel-title">👑 Host</div>
        <button class="btn btn-primary btn-sm" onclick="hostDiscuss()">▶️ Iniciar Discussão (3 min)</button>
      </div>`:''}
      <button class="btn btn-secondary" onclick="G.wordRevealed=false;render()" style="margin-top:10px">🙈 Esconder</button>`
    :`<div class="word-card tap" onclick="G.wordRevealed=true;render()">
        <div style="font-size:2rem;margin-bottom:10px">👁️</div>
        <div style="font-weight:700">Toque para ver sua palavra</div>
        <div style="color:var(--muted);font-size:.82rem;margin-top:6px">Garanta que ninguém está olhando!</div>
      </div>`
  }
  <div class="player-list" style="margin-top:16px">
    ${names.map(n=>`<div class="player-row" style="padding:8px 12px">
      <div class="avatar" style="background:${aC(n)};width:28px;height:28px;font-size:.72rem">${init2(n)}</div>
      <div class="player-name" style="font-size:.85rem">${esc(n)}</div>
      <div class="badge ${pData(n).ready?'ready':''}">${pData(n).ready?'✅ Pronto':'Aguardando'}</div>
    </div>`).join('')}
  </div>
</div></div>`;
}
function rDiscuss(){
  const t=gs?.themeId?themeById(gs.themeId):null;
  const urgent=timerVal<=30;
  const mins=Math.floor(timerVal/60).toString().padStart(2,'0');
  const secs=(timerVal%60).toString().padStart(2,'0');
  app.innerHTML=`<div class="page active"><div class="screen" style="padding-top:28px">
  <div style="text-align:center;margin-bottom:20px">
    <div style="font-size:1.6rem;font-weight:900">💬 Discussão</div>
    <div style="color:var(--muted);margin-top:4px">Rodada ${gs?.round||1} · ${t?.cat||''}</div>
  </div>
  <div class="timer-box">
    <div class="timer-num ${urgent?'urgent':''}">${mins}:${secs}</div>
    <div class="timer-label">Tempo restante — discutam sobre o tema!</div>
  </div>
  <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:.85rem;line-height:1.6;margin-bottom:16px">
    💡 Façam perguntas sobre o tema. O impostor tentará disfarçar que não sabe a palavra exata.
  </div>
  ${G.isHost
    ?`<div class="host-panel"><div class="host-panel-title">👑 Host</div>
      <button class="btn btn-secondary btn-sm" onclick="roomRef.update({phase:'voting',discEnd:0})">⏭️ Pular para Votação</button>
    </div>`
    :'<div class="status">Quando o tempo acabar, passará para a votação</div>'
  }
</div></div>`;
}
function rVote(){
  const names=players();
  const myVoted=pData(G.myName).vote||G.myVote;
  const votedCount=names.filter(n=>pData(n).vote).length;
  app.innerHTML=`<div class="page active"><div class="screen" style="padding-top:28px">
  <div style="text-align:center;margin-bottom:20px">
    <div style="font-size:1.6rem;font-weight:900">🗳️ Votação</div>
    <div style="color:var(--muted);margin-top:4px">Quem é o impostor? (${votedCount}/${names.length} votaram)</div>
  </div>
  ${myVoted?`<div class="status">✅ Você votou em <b>${esc(myVoted)}</b>. Aguardando os outros<span class="dots"></span></div>`:''}
  ${G.myName===gs?.impostorName?`<div class="info">🎭 Você é o impostor! Tente não ser votado.</div>`:''}
  <div class="vote-grid">
    ${names.map(n=>{
      const isMe=n===G.myName;
      const isSelected=(G.myVote||pData(G.myName).vote)===n;
      const cls=isMe?'no-vote':(myVoted?'done':'');
      const safeN=n.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="vote-card ${isSelected?'selected':cls}" onclick="${!isMe&&!myVoted?`castVote('${safeN}')`:''}" >
        <div style="font-size:1.6rem">${aE(n)}</div>
        <div style="font-size:.88rem;font-weight:600;margin-top:6px">${esc(n)}</div>
        ${isMe?'<div style="font-size:.7rem;color:var(--muted)">você</div>':''}
        ${pData(n).vote?'<div style="font-size:.7rem;color:var(--green);margin-top:2px">✓ votou</div>':''}
      </div>`;
    }).join('')}
  </div>
  ${G.isHost?`<button class="btn btn-secondary" onclick="hostResult()">🔍 Revelar resultado agora</button>`:''}
</div></div>`;
}
function rResults(){
  const r=gs?.result;
  if(!r){G.page='lobby';render();return;}
  const isImp=G.myName===r.impostorName;
  const iCaught=r.caught;
  const t=gs?.themeId?themeById(gs.themeId):null;
  const scores=gs?.scores||{};
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const myGuessed=pData(G.myName).impostorGuess!=null;
  const showGuess=isImp&&iCaught&&r.impostorGuess==null&&!myGuessed;
  app.innerHTML=`<div class="page active"><div class="screen" style="padding-top:28px">
  <div class="result-banner ${iCaught?'caught':'escaped'}">
    <div class="result-emoji">${iCaught?(isImp?'😵':'🎉'):(isImp?'😈':'😢')}</div>
    <div class="result-title">${iCaught?(isImp?'Você foi pego!':'Impostor capturado!'):(isImp?'Você escapou!':'O impostor escapou!')}</div>
    <div class="result-sub">${iCaught?`${esc(r.eliminated||'?')} era o impostor`:`${esc(r.impostorName||'?')} era o impostor e não foi eliminado`}</div>
  </div>
  <div class="word-reveal-box">
    <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em">A palavra era</div>
    <div style="font-size:1.6rem;font-weight:900;margin-top:4px">${esc(r.word||gs?.word||'')}</div>
    <div style="color:var(--muted);font-size:.82rem;margin-top:2px">${t?.cat||''}</div>
  </div>
  ${r.impostorGuess!=null?`<div class="word-reveal-box">
    <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em">Palpite do impostor</div>
    <div style="font-size:1.1rem;font-weight:700;margin-top:4px;color:${r.impostorGuessCorrect?'var(--green)':'var(--red)'}">
      "${esc(r.impostorGuess)}" ${r.impostorGuessCorrect?'✅ Correto! +3 pts':'❌ Errado'}
    </div>
  </div>`:''}
  ${showGuess?`<div class="host-panel" style="border-color:var(--red)">
    <div class="host-panel-title" style="color:var(--red)">🎭 Você foi pego! Tente adivinhar a palavra (+3 pts)</div>
    <input class="input" type="text" placeholder="Qual era a palavra?" oninput="G.impostorGuess=this.value" value="${esc(G.impostorGuess)}" autocomplete="off"/>
    <button class="btn btn-danger" onclick="sendGuess()">Enviar palpite</button>
  </div>`:''}
  <div style="font-weight:700;margin-bottom:10px;font-size:.95rem">📊 Placar geral</div>
  <div class="scores-list">
    ${sorted.map(([n,pts],i)=>`<div class="score-row">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="color:var(--muted);width:18px;font-size:.85rem;text-align:center">${i+1}</div>
        <div class="avatar" style="background:${aC(n)};width:28px;height:28px;font-size:.72rem">${init2(n)}</div>
        <div>${esc(n)}</div>
        ${n===r.impostorName?'<span style="font-size:.68rem;background:rgba(255,68,68,.2);color:var(--red);padding:2px 7px;border-radius:10px">impostor</span>':''}
      </div>
      <div class="score-pts">${pts} pts</div>
    </div>`).join('')}
  </div>
  ${G.isHost
    ?`<button class="btn btn-primary" onclick="hostStart()">🔄 Próxima Rodada</button>
      <button class="btn btn-secondary" onclick="leaveRoom()" style="margin-top:10px">🚪 Encerrar jogo</button>`
    :`<div class="status">Aguardando o host iniciar a próxima rodada<span class="dots"></span></div>
      <button class="btn btn-secondary" onclick="leaveRoom()" style="margin-top:10px">🚪 Sair</button>`
  }
</div></div>`;
}

// ── START ─────────────────────────────────────────────────────────────────────
render();
</script>
