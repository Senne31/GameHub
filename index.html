<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub</title>
<style>
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e3f;
  --text:#e8e8f0;--muted:#7070a0;--accent:#7c4dff;--accent2:#00e5ff;
  --red:#ff4444;--green:#44ff88;--yellow:#ffcc44;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#app{min-height:100vh}
.page{display:none;min-height:100vh;padding:20px 16px 48px;flex-direction:column}
.page.active{display:flex}
.screen{max-width:480px;margin:0 auto;width:100%}
.hub-header{text-align:center;padding:48px 20px 36px}
.hub-logo{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub-sub{color:var(--muted);margin-top:8px;font-size:.9rem}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:440px;margin:0 auto;width:100%}
.game-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;user-select:none}
.game-card:active{transform:scale(.97)}
.game-card.live{border-color:var(--accent)}
.game-card.live:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(124,77,255,.25)}
.game-card.soon{opacity:.45;cursor:default}
.soon-badge{position:absolute;top:10px;right:-18px;background:var(--surface2);color:var(--muted);font-size:.6rem;padding:3px 24px;transform:rotate(30deg);letter-spacing:.05em;text-transform:uppercase}
.card-icon{font-size:2.4rem;margin-bottom:12px}
.card-name{font-size:.9rem;font-weight:700}
.title{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.input{display:block;width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;margin-bottom:12px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;-webkit-appearance:none}
.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:not(:disabled):hover{background:#9060ff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}
.btn-red{background:rgba(255,68,68,.2);color:#ff8888;border:1.5px solid var(--red)}
.btn-blue{background:rgba(0,229,255,.12);color:var(--accent2);border:1.5px solid var(--accent2)}
.btn-sm{padding:9px 14px;font-size:.85rem;border-radius:8px}
.back{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:8px 0;margin-bottom:18px;display:flex;align-items:center;gap:5px}
.back:hover{color:var(--text)}
.alert{padding:11px 14px;border-radius:8px;background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);color:#ff8888;font-size:.85rem;margin-bottom:14px}
.info{padding:11px 14px;border-radius:8px;background:rgba(124,77,255,.1);border:1px solid rgba(124,77,255,.3);color:#b09fff;font-size:.85rem;margin-bottom:14px}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{color:var(--muted);font-size:.82rem}
.code-box{background:var(--surface2);border:2px solid var(--accent);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:22px}
.code-big{font-size:2.6rem;font-weight:900;letter-spacing:.18em;color:var(--accent2);font-family:'Courier New',monospace}
.code-hint{color:var(--muted);font-size:.78rem;margin-top:6px}
.player-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.player-row{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface2);border-radius:10px;border:1.5px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.player-name{font-weight:600;flex:1;font-size:.92rem}
.badge{font-size:.72rem;padding:3px 9px;border-radius:20px;background:var(--surface);color:var(--muted);white-space:nowrap}
.badge.host{background:rgba(124,77,255,.2);color:var(--accent)}
.badge.you{background:rgba(0,229,255,.15);color:var(--accent2)}
.badge.ready{background:rgba(68,255,136,.18);color:var(--green)}
.badge.red-t{background:rgba(255,68,68,.2);color:#ff8888}
.badge.blue-t{background:rgba(0,229,255,.12);color:var(--accent2)}
/* Impostor styles */
.word-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:36px 24px;text-align:center;margin-bottom:22px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s}
.word-card.tap{cursor:pointer}.word-card.tap:active{transform:scale(.98)}.word-card.impostor{border-color:var(--red)}
.word-big{font-size:2.1rem;font-weight:900}
.theme-lbl{font-size:.83rem;color:var(--muted);margin-bottom:8px}
.timer-box{background:var(--surface2);border-radius:var(--r);padding:22px;text-align:center;margin-bottom:20px;border:1.5px solid var(--border)}
.timer-num{font-size:3rem;font-weight:900;font-family:'Courier New',monospace;color:var(--accent2);line-height:1}
.timer-num.urgent{color:var(--red)}
.timer-label{color:var(--muted);font-size:.8rem;margin-top:6px}
.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.vote-card{background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.vote-card:not(.no-vote):not(.done):hover{border-color:var(--accent)}
.vote-card:not(.no-vote):not(.done):active{transform:scale(.97)}
.vote-card.selected{border-color:var(--accent);background:rgba(124,77,255,.14)}
.vote-card.no-vote{opacity:.35;cursor:default}.vote-card.done{opacity:.7;cursor:default}
.result-banner{padding:26px;text-align:center;border-radius:var(--r);margin-bottom:18px}
.result-banner.caught{background:rgba(68,255,136,.08);border:2px solid var(--green)}
.result-banner.escaped{background:rgba(255,68,68,.08);border:2px solid var(--red)}
.result-emoji{font-size:3rem;margin-bottom:8px}
.result-title{font-size:1.35rem;font-weight:800}
.result-sub{color:var(--muted);font-size:.88rem;margin-top:5px}
.word-reveal-box{background:var(--surface2);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;text-align:center}
.scores-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-radius:8px}
.score-pts{font-weight:700;color:var(--accent2)}
.status{padding:10px 14px;background:var(--surface2);border-radius:8px;color:var(--muted);font-size:.85rem;margin-bottom:12px;border:1px solid var(--border)}
.host-panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;margin-top:14px}
.host-panel-title{font-size:.8rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-weight:700}
/* Codenames styles */
.cn-board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}
.cn-card{border-radius:7px;padding:5px 3px;text-align:center;font-size:.62rem;font-weight:800;min-height:50px;display:flex;align-items:center;justify-content:center;line-height:1.15;word-break:break-word;transition:all .15s;user-select:none;text-transform:uppercase;letter-spacing:.03em;border:2px solid transparent;cursor:default}
.cn-card.clickable{cursor:pointer}
.cn-card.clickable:hover{transform:scale(1.05);z-index:1}
.cn-card.clickable:active{transform:scale(.97)}
.cn-card.h{background:var(--surface2);color:var(--text);border-color:var(--border)}
.cn-card.h.clickable:hover{border-color:var(--accent)}
.cn-card.r{background:rgba(255,68,68,.85);color:#fff;border-color:#ff2222}
.cn-card.b{background:rgba(0,140,200,.85);color:#fff;border-color:#0099dd}
.cn-card.n{background:#3a3a4a;color:#9090a0;border-color:#4a4a5a}
.cn-card.x{background:#111;color:#555;border-color:#222}
.cn-card.sr{background:rgba(255,68,68,.25);color:#ff9999;border-color:#ff4444}
.cn-card.sb{background:rgba(0,180,220,.2);color:#66ddff;border-color:#00aadd}
.cn-card.sn{background:rgba(255,204,68,.08);color:#aa9955;border-color:#665500}
.cn-card.sx{background:rgba(20,20,20,.8);color:#666;border-color:#333}
.cn-card.done{opacity:.55;cursor:default!important;transform:none!important}
.cn-score-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.cn-score-red{font-size:1.3rem;font-weight:900;color:#ff6666}
.cn-score-blue{font-size:1.3rem;font-weight:900;color:var(--accent2)}
.cn-turn-bar{text-align:center;padding:8px 14px;border-radius:8px;font-weight:700;font-size:.88rem;margin-bottom:10px}
.cn-turn-bar.red{background:rgba(255,68,68,.15);color:#ff8888;border:1px solid rgba(255,68,68,.3)}
.cn-turn-bar.blue{background:rgba(0,229,255,.08);color:var(--accent2);border:1px solid rgba(0,229,255,.2)}
.cn-clue-display{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;text-align:center}
.cn-clue-word{font-size:1.5rem;font-weight:900;color:var(--accent2)}
.cn-clue-count{font-size:.85rem;color:var(--muted);margin-top:3px}
.cn-spy-panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cn-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.cn-legend-item{display:flex;align-items:center;gap:4px;font-size:.72rem}
.cn-legend-dot{width:10px;height:10px;border-radius:2px}
.team-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.team-btn{padding:20px 12px;border-radius:10px;border:2px solid;cursor:pointer;text-align:center;transition:all .2s;background:transparent}
.team-btn.red{border-color:rgba(255,68,68,.4);color:#ff8888}
.team-btn.red.active{background:rgba(255,68,68,.2);border-color:var(--red)}
.team-btn.blue{border-color:rgba(0,229,255,.3);color:var(--accent2)}
.team-btn.blue.active{background:rgba(0,229,255,.1);border-color:var(--accent2)}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role-btn{padding:16px 10px;border-radius:10px;border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .2s;background:transparent;color:var(--muted)}
.role-btn.active{border-color:var(--accent);color:var(--text);background:rgba(124,77,255,.1)}
.role-icon{font-size:1.5rem;display:block;margin-bottom:5px}
/* Shared */
.dots::after{content:'...';animation:d 1.4s infinite steps(4,end)}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.connecting{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

const IMP={nameInput:'',codeInput:'',roomCode:'',myName:'',isHost:false,wordRevealed:false,myVote:null,impostorGuess:''};
let gs=null,roomRef=null,unsubGame=null,timerInt=null,timerVal=0,advancing=false;

function themeById(id){return THEMES.find(t=>t.id===id);}
function impPlayers(){return Object.keys(gs?.players||{});}
function impPD(n){return gs?.players?.[n]||{};}

function onImpState(snap){
  const prev=gs?.phase;gs=snap.val();
  if(!gs){if(!IMP.isHost)impCleanLeave();return;}
  if(gs.phase!==prev){
    IMP.wordRevealed=false;IMP.myVote=null;advancing=false;
    if(gs.phase==='discussion')impStartTimer();else clearInterval(timerInt);
  }
  if(IMP.isHost&&gs.phase==='voting'&&!advancing){
    const names=impPlayers();
    if(names.length>1&&names.every(n=>impPD(n).vote))impHostResult();
  }
  if(IMP.isHost&&gs.phase==='results'&&gs.result?.caught&&gs.result?.impostorGuess==null){
    const imp=gs.impostorName;
    if(imp&&impPD(imp).impostorGuess!=null){
      const guess=impPD(imp).impostorGuess,correct=(gs.word||'').toLowerCase()===guess.toLowerCase();
      const ns={...gs.scores||{}};if(correct)ns[imp]=(ns[imp]||0)+3;
      roomRef.update({'result/impostorGuess':guess,'result/impostorGuessCorrect':correct,scores:ns});
    }
  }
  render();
}

function impStartTimer(){
  clearInterval(timerInt);
  const tick=()=>{
    timerVal=Math.max(0,Math.ceil(((gs?.discEnd||0)-Date.now())/1000));render();
    if(timerVal<=0){clearInterval(timerInt);
      if(IMP.isHost&&gs?.phase==='discussion'&&!advancing){
        advancing=true;roomRef.update({phase:'voting',discEnd:0}).finally(()=>{advancing=false;});
      }
    }
  };
  timerInt=setInterval(tick,500);tick();
}

async function impHostStart(){
  const names=impPlayers();if(names.length<2){G.error='Precisa de pelo menos 2 jogadores!';render();return;}
  const t=rand(THEMES),w=rand(t.words),imp=rand(names),round=(gs?.round||0)+1;
  const pd={};names.forEach(n=>{pd[n]={...impPD(n),ready:false,vote:null,impostorGuess:null};});
  await roomRef.update({phase:'word',themeId:t.id,word:w,impostorName:imp,discEnd:0,round,result:null,players:pd});
}
async function impHostDiscuss(){await roomRef.update({phase:'discussion',discEnd:Date.now()+180000});}
async function impHostResult(){
  if(advancing)return;advancing=true;
  try{
    const names=impPlayers(),counts={};
    names.forEach(n=>{const v=impPD(n).vote;if(v)counts[v]=(counts[v]||0)+1;});
    let top=0,elim=null;for(const[n,c]of Object.entries(counts)){if(c>top){top=c;elim=n;}}
    const caught=elim===gs.impostorName,ns={...gs.scores||{}};
    names.forEach(n=>{if(!(n in ns))ns[n]=0;});
    if(caught)names.forEach(n=>{if(n!==gs.impostorName)ns[n]=(ns[n]||0)+1;});
    else if(gs.impostorName)ns[gs.impostorName]=(ns[gs.impostorName]||0)+2;
    await roomRef.update({phase:'results',scores:ns,result:{caught,eliminated:elim,counts,impostorName:gs.impostorName,word:gs.word}});
  }finally{advancing=false;}
}
async function impSetReady(){IMP.wordRevealed=true;await roomRef.child('players/'+IMP.myName).update({ready:true});render();}
async function impCastVote(name){if(IMP.myVote)return;IMP.myVote=name;await roomRef.child('players/'+IMP.myName).update({vote:name});render();}
async function impSendGuess(){const g=IMP.impostorGuess.trim();if(!g)return;await roomRef.child('players/'+IMP.myName).update({impostorGuess:g});IMP.impostorGuess='';render();}

async function impJoin(code,name,asHost){
  G.loading=true;G.error='';render();
  try{
    const ref=db.ref('rooms/'+code.toLowerCase());
    if(asHost){
      await ref.set({phase:'lobby',themeId:null,word:'',impostorName:null,discEnd:0,round:0,scores:{},result:null,hostName:name,
        players:{[name]:{isHost:true,ready:false,vote:null,impostorGuess:null,joinedAt:Date.now()}}});
    }else{
      const snap=await ref.once('value');
      if(!snap.exists()){G.loading=false;G.error='Sala não encontrada!';render();return;}
      const d=snap.val();
      if(d.players&&d.players[name]){G.loading=false;G.error='Nome já em uso nesta sala!';render();return;}
      if(d.phase&&d.phase!=='lobby'){G.loading=false;G.error='O jogo já começou!';render();return;}
      await ref.child('players/'+name).set({isHost:false,ready:false,vote:null,impostorGuess:null,joinedAt:Date.now()});
    }
    IMP.roomCode=code.toUpperCase();IMP.myName=name;IMP.isHost=asHost;
    G.loading=false;G.page='imp-lobby';roomRef=ref;
    ref.child('players/'+name).onDisconnect().remove();
    unsubGame=ref.on('value',onImpState);render();
  }catch(e){G.loading=false;G.error='Não foi possível conectar.';render();}
}
async function impCreate(){
  const n=(IMP.nameInput||'').trim();
  if(!n){G.error='Digite seu nome!';render();return;}
  await impJoin(randCode(),n,true);
}
async function impEnter(){
  const n=(IMP.nameInput||'').trim(),c=(IMP.codeInput||'').trim().toUpperCase();
  if(!n){G.error='Digite seu nome!';render();return;}
  if(!c||c.length!==4){G.error='Código deve ter 4 letras!';render();return;}
  await impJoin(c,n,false);
}
async function impCleanLeave(){
  clearInterval(timerInt);
  if(roomRef&&unsubGame){roomRef.off('value',unsubGame);unsubGame=null;}
  roomRef=null;gs=null;
  IMP.roomCode='';IMP.myName='';IMP.isHost=false;IMP.myVote=null;IMP.wordRevealed=false;IMP.impostorGuess='';
  advancing=false;G.error='';G.page='hub';render();
}
async function impLeave(){
  if(roomRef){
    if(IMP.isHost)await roomRef.remove().catch(()=>{});
    else{roomRef.child('players/'+IMP.myName).onDisconnect().cancel();await roomRef.child('players/'+IMP.myName).remove().catch(()=>{});}
  }
  await impCleanLeave();
}

const CN={nameInput:'',codeInput:'',roomCode:'',myName:'',myTeam:null,myRole:null,isHost:false,clueWord:'',clueCount:'1',error:'',loading:false};
let cns=null,cnRef=null,cnUnsub=null;

function cnPL(){return Object.entries(cns?.players||{});}
function cnPD(n){return cns?.players?.[n]||{};}
function cnCards(){return Object.values(cns?.cards||{});}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function cnGenCards(){
  const words=shuffle(CN_WORDS).slice(0,25);
  // Red=9(first team), Blue=8, Assassin=1, Neutral=7
  const assign=shuffle([...Array(9).fill('r'),...Array(8).fill('b'),...Array(1).fill('x'),...Array(7).fill('n')]);
  const cards={};
  words.forEach((w,i)=>{cards[i]={w,t:assign[i],rv:false};});
  return cards;
}

function onCnState(snap){
  cns=snap.val();
  if(!cns){if(!CN.isHost)cnCleanLeave();return;}
  // host: check win conditions
  if(CN.isHost&&(cns.phase==='r'||cns.phase==='b')&&!cns.winner){
    const cards=cnCards();
    const rLeft=cards.filter(c=>c.t==='r'&&!c.rv).length;
    const bLeft=cards.filter(c=>c.t==='b'&&!c.rv).length;
    if(rLeft===0){cnRef.update({winner:'r',phase:'ended'});}
    else if(bLeft===0){cnRef.update({winner:'b',phase:'ended'});}
  }
  render();
}

async function cnCreate(){
  const n=(CN.nameInput||'').trim();
  if(!n){CN.error='Digite seu nome!';render();return;}
  CN.loading=true;CN.error='';render();
  try{
    const code=randCode(),ref=db.ref('cn/'+code.toLowerCase());
    const cards=cnGenCards();
    await ref.set({phase:'lobby',hostName:n,winner:null,clue:null,
      redLeft:9,blueLeft:8,
      players:{[n]:{team:null,role:null,isHost:true,joinedAt:Date.now()}},
      cards});
    CN.roomCode=code.toUpperCase();CN.myName=n;CN.isHost=true;CN.myTeam=null;CN.myRole=null;
    CN.loading=false;G.page='cn-lobby';cnRef=ref;
    ref.child('players/'+n).onDisconnect().remove();
    cnUnsub=ref.on('value',onCnState);render();
  }catch(e){CN.loading=false;CN.error='Não foi possível conectar.';render();}
}

async function cnJoin(){
  const n=(CN.nameInput||'').trim(),code=(CN.codeInput||'').trim().toUpperCase();
  if(!n){CN.error='Digite seu nome!';render();return;}
  if(!code||code.length!==4){CN.error='Código deve ter 4 letras!';render();return;}
  CN.loading=true;CN.error='';render();
  try{
    const ref=db.ref('cn/'+code.toLowerCase());
    const snap=await ref.once('value');
    if(!snap.exists()){CN.loading=false;CN.error='Sala não encontrada!';render();return;}
    const d=snap.val();
    if(d.players&&d.players[n]){CN.loading=false;CN.error='Nome já em uso!';render();return;}
    if(d.phase&&d.phase!=='lobby'){CN.loading=false;CN.error='O jogo já começou!';render();return;}
    await ref.child('players/'+n).set({team:null,role:null,isHost:false,joinedAt:Date.now()});
    CN.roomCode=code.toUpperCase();CN.myName=n;CN.isHost=false;CN.myTeam=null;CN.myRole=null;
    CN.loading=false;G.page='cn-lobby';cnRef=ref;
    ref.child('players/'+n).onDisconnect().remove();
    cnUnsub=ref.on('value',onCnState);render();
  }catch(e){CN.loading=false;CN.error='Não foi possível conectar.';render();}
}

async function cnSetTeam(team){
  CN.myTeam=team;
  await cnRef.child('players/'+CN.myName).update({team});render();
}
async function cnSetRole(role){
  CN.myRole=role;
  await cnRef.child('players/'+CN.myName).update({role});render();
}

async function cnStart(){
  const players=cnPL();
  const redSpy=players.find(([,p])=>p.team==='r'&&p.role==='spy');
  const blueSpy=players.find(([,p])=>p.team==='b'&&p.role==='spy');
  if(!redSpy){CN.error='Time vermelho precisa de um Espião Chefe!';render();return;}
  if(!blueSpy){CN.error='Time azul precisa de um Espião Chefe!';render();return;}
  const redP=players.filter(([,p])=>p.team==='r').length;
  const blueP=players.filter(([,p])=>p.team==='b').length;
  if(redP<1||blueP<1){CN.error='Cada time precisa de pelo menos 1 jogador!';render();return;}
  await cnRef.update({phase:'r',clue:null});// red goes first
}

async function cnGiveClue(){
  const w=(CN.clueWord||'').trim();
  if(!w){CN.error='Digite uma palavra-pista!';render();return;}
  const count=parseInt(CN.clueCount)||1;
  await cnRef.update({clue:{word:w.toUpperCase(),count,guessesLeft:count+1}});
  CN.clueWord='';CN.clueCount='1';render();
}

async function cnGuess(idx){
  if(!cns||!cnRef)return;
  const card=cns.cards[idx];
  if(!card||card.rv)return;
  // Only current team's operatives can guess
  const myRole=cnPD(CN.myName).role;
  const myTeam=cnPD(CN.myName).team;
  if(myRole==='spy')return;// spymaster can't guess
  if(myTeam!==cns.phase)return;// not your turn
  if(!cns.clue)return;// need clue first

  // Reveal card
  await cnRef.child('cards/'+idx).update({rv:true});

  // Check what was revealed
  const t=card.t;
  if(t==='x'){// assassin - game over
    const loser=cns.phase,winner=loser==='r'?'b':'r';
    await cnRef.update({winner,phase:'ended',clue:null});return;
  }

  // Recalculate scores
  const snap=await cnRef.once('value');
  const st=snap.val();
  const cards=Object.values(st.cards||{});
  const rLeft=cards.filter(c=>c.t==='r'&&!c.rv).length;
  const bLeft=cards.filter(c=>c.t==='b'&&!c.rv).length;
  const update={redLeft:rLeft,blueLeft:bLeft};

  if(rLeft===0){update.winner='r';update.phase='ended';update.clue=null;}
  else if(bLeft===0){update.winner='b';update.phase='ended';update.clue=null;}
  else if(t!==cns.phase){// wrong team or neutral → end turn
    update.phase=cns.phase==='r'?'b':'r';update.clue=null;
  }else{// correct! decrement guesses
    const gl=(st.clue?.guessesLeft||1)-1;
    if(gl<=0){update.phase=cns.phase==='r'?'b':'r';update.clue=null;}
    else{update['clue/guessesLeft']=gl;}
  }
  await cnRef.update(update);
}

async function cnEndTurn(){
  const nextTeam=cns.phase==='r'?'b':'r';
  await cnRef.update({phase:nextTeam,clue:null});
}

async function cnCleanLeave(){
  if(cnRef&&cnUnsub){cnRef.off('value',cnUnsub);cnUnsub=null;}
  cnRef=null;cns=null;
  CN.roomCode='';CN.myName='';CN.isHost=false;CN.myTeam=null;CN.myRole=null;
  CN.clueWord='';CN.clueCount='1';CN.error='';CN.loading=false;
  G.error='';G.page='hub';render();
}
async function cnLeave(){
  if(cnRef){
    if(CN.isHost)await cnRef.remove().catch(()=>{});
    else{cnRef.child('players/'+CN.myName).onDisconnect().cancel();await cnRef.child('players/'+CN.myName).remove().catch(()=>{});}
  }
  await cnCleanLeave();
}

  const cards=cns.cards||{};

    ?`<button class="btn btn-primary" onclick="cnRematch()">🔄 Nova Partida</button>
      <button class="btn btn-secondary" onclick="cnLeave()" style="margin-top:10px">🚪 Encerrar</button>`
    :`<div class="status">Aguardando nova partida<span class="dots"></span></div>
      <button class="btn btn-secondary" onclick="cnLeave()" style="margin-top:10px">🚪 Sair</button>`}
</div></div>`;
}

async function cnRematch(){
  const cards=cnGenCards();
  await cnRef.update({phase:'lobby',winner:null,clue:null,redLeft:9,blueLeft:8,cards});
  // Reset player choices
  const players=cnPL();
  const updates={};
  players.forEach(([n])=>{updates[`players/${n}/team`]=null;updates[`players/${n}/role`]=null;});
  await cnRef.update(updates);
}

const app=document.getElementById('app');
function render(){
  // Sync page state before routing
  if(cns&&G.page==='cn-lobby'&&cns.phase!=='lobby')G.page='cn-game';
  if(cns&&G.page==='cn-game'&&cns.phase==='lobby')G.page='cn-lobby';
  if(gs&&(G.page==='imp-lobby'||G.page==='imp-game'))G.page='imp-game';
  const p=G.page;
  if(p==='hub')return rHub();
  if(p==='imp-home')return rImpHome();
  if(p==='imp-lobby'||p==='imp-game')return rImpGame();
  if(p==='cn-home')return rCnHome();
  if(p==='cn-lobby')return rCnLobby();
  if(p==='cn-game')return rCnGame();
}

function rHub(){
  app.innerHTML=`<div class="page active">
  <div class="hub-header">
    <div class="hub-logo">🎮 GameHub</div>
    <div class="hub-sub">Jogos para jogar com seus amigos</div>
  </div>
  <div class="games-grid">

      <div class="card-icon">🕵️</div>
      <div class="card-name">Quem é o Impostor?</div>
    </div>
    <div class="game-card live" onclick="G.page='cn-home';G.error='';CN.nameInput='';CN.codeInput='';render()">
      <div class="card-icon">🔐</div>
      <div class="card-name">Codinomes</div>
    </div>
    <div class="game-card soon"><div class="soon-badge">Em Breve</div><div class="card-icon">📝</div><div class="card-name">Quem Sou Eu?</div></div>
    <div class="game-card soon"><div class="soon-badge">Em Breve</div><div class="card-icon">🎨</div><div class="card-name">Gartic Phone</div></div>
  </div>
</div>`;
}

render();
</script>
